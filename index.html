    .skeleton {

    <script id="wglive_15572_1779742810382">
    (function (window, document) {
      var TIMEOUT_MS   = 15000;
      var MAX_RETRIES  = 2;
      var retries      = 0;

      function loadWidget() {
        var arg = ["spot=15572","uid=wglive_15572_1779742810382","direct=1","wj=knots","tj=c","avg_min=0","gsize=400","msize=400","m=3","ai=0","show=n,g,c"];
        var script = document.createElement("script");
        var tag    = document.getElementsByTagName("script")[0];

        script.async = true;

        script.onerror = function () {
          if (retries < MAX_RETRIES) {
            retries++;
            setTimeout(loadWidget, 3000);
          } else {
            showError("network");
          }

        script.src = "https://www.windguru.cz/js/wglive.php?" + arg.join("&");
        tag.parentNode.insertBefore(script, tag);

        setTimeout(function () {
          var c = document.getElementById("wind-container");

              retries++;

        c.innerHTML =
          "<div class=\"error-state\">" +
            "<span class=\"error-icon\">" + (isTimeout ? "&#x23F1;&#xFE0F;" : "&#x26A0;&#xFE0F;") + "</span>" +

            "<button class=\"retry-btn\" onclick=\"location.reload()\">&#x21BA; Tentar novamente</button>" +
          "</div>";
      }
